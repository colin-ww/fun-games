<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIMER CHECK!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #fff8e7; --ink: #2b2d42; --card: #fff; --line: #e6dcc0; --hot: #e63946; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 0 1rem calc(2rem + env(safe-area-inset-bottom)); }

  h1 {
    margin: .3em 0 .15em; text-align: center; text-transform: uppercase; color: var(--hot);
    font: 900 clamp(2.6rem, 14vw, 5.5rem)/1 Impact, 'Arial Black', system-ui, sans-serif;
    letter-spacing: .02em; text-shadow: 3px 3px 0 var(--ink);
  }

  /* ---- the animation ---- */
  #stage {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; padding: 1rem;
    background: #fff; border: 3px solid var(--ink); border-radius: 22px; overflow: hidden;
  }
  @media (min-width: 640px) { #stage { grid-template-columns: repeat(4, 1fr); } }
  .fig {
    position: relative; aspect-ratio: 1; cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .spinner { width: 100%; height: 100%; }
  .spinner svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---- buttons under the animation ---- */
  #controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .6rem; margin: .8rem 0; }
  .btn {
    min-height: 56px; min-width: 56px; font: inherit; font-size: 1.1rem; font-weight: 700; color: var(--ink);
    background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 0 1.1rem; cursor: pointer;
  }
  .btn:active { transform: translateY(2px); }
  .btn.pulse { background: #ffe066; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  /* ---- visual toggles ---- */
  .group h2 { margin: 1rem 0 .4rem; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
  .tiles { display: flex; flex-wrap: wrap; gap: .5rem; }
  .tile {
    width: 76px; min-height: 88px; padding: .4rem .2rem; display: flex; flex-direction: column; align-items: center; gap: .15rem;
    font: inherit; font-size: .8rem; font-weight: 700; color: var(--ink); background: var(--card);
    border: 3px solid var(--ink); border-radius: 16px; cursor: pointer;
    opacity: .4; filter: grayscale(.9); transition: opacity .15s, filter .15s, transform .15s;
  }
  .tile.on { opacity: 1; filter: none; background: #fff3b0; transform: translateY(-2px); box-shadow: 0 4px 0 var(--ink); }
  .tile .ico { font-size: 2rem; line-height: 48px; height: 48px; }
  .tile .ico svg { width: 48px; height: 48px; display: block; }

  /* ---- descriptions + turn-things-off ---- */
  #descriptions { margin: 1.2rem 0 0; padding: 0; list-style: none; font-size: .95rem; }
  #descriptions li { padding: .35rem 0; border-top: 1px solid var(--line); }
  #settings { margin-top: 1.5rem; background: var(--card); border: 2px dashed var(--ink); border-radius: 14px; padding: .6rem .9rem; }
  #settings summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  #settings label { display: flex; gap: .6rem; align-items: center; padding: .45rem 0; border-top: 1px solid var(--line); }
  #settings input[type=checkbox] { width: 1.4rem; height: 1.4rem; flex: none; }
  #settings .btn { min-height: 44px; font-size: 1rem; margin-top: .6rem; }
  footer { margin-top: 1rem; text-align: center; font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
<div id="app">
  <h1>TIMER CHECK!</h1>
  <main id="stage" aria-label="Spinning figures"></main>
  <div id="controls"></div>
  <div id="tiles"></div>
  <ul id="descriptions"></ul>
  <details id="settings">
    <summary>🛠 Something broken? Turn things off</summary>
    <div id="switches"></div>
    <button class="btn" id="reset">↩︎ Turn everything back on &amp; reset</button>
  </details>
  <footer id="footer"></footer>
</div>
<noscript>This page needs JavaScript.</noscript>

<script>
'use strict';

/* =============================================================================
   CORE  –  small feature registry. Every feature below is one register({...})
   block that can be switched off live (bottom of the page, or ?off=hold,volume).
   To remove a feature for good, delete its block (or git revert its commit).
   ============================================================================= */

const APP_VERSION = '1.0.0';

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const svg = inner => `<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;

const FIGURES = 4;
const DURATIONS = [1.4, 1.1, 1.7, 1.25];          // seconds per turn, per figure
const COLORS = ['#e63946', '#2a9d8f', '#e9a100', '#6a4c93'];

// Exclusive pick-one groups shown as visual tiles. Features contribute the tiles.
const GROUPS = [
  { id: 'look', title: 'Look', default: 'round' },
  { id: 'bg', title: 'Background', default: 'sky' },
  { id: 'beat', title: 'Beat', default: 'tune' },
  { id: 'voice', title: 'Sound', default: 'beep' },
];

const FEATURES = [];
const register = f => FEATURES.push(f);

const app = {
  on: new Set(),                                   // enabled feature ids
  spin: Array(FIGURES).fill(true),
  anims: [],                                       // one Web Animation per figure
  choice: Object.fromEntries(GROUPS.map(g => [g.id, g.default])),
  flags: {},                                       // toggle-tiles (e.g. background cycling)
  listeners: {},
  stage: $('#stage'),
  controls: $('#controls'),
};

app.emit = (type, detail) => (app.listeners[type] ?? []).forEach(fn => fn(detail));

/* tiles offered by the currently enabled features */
const tiles = () => FEATURES.filter(f => app.on.has(f.id)).flatMap(f => (f.tiles ?? []).map(t => ({ ...t, feature: f })));

/* the picked option of a group; falls back if its feature was switched off */
app.get = group => {
  const ids = tiles().filter(t => t.group === group && !t.toggle).map(t => t.id);
  const dflt = GROUPS.find(g => g.id === group).default;
  return ids.includes(app.choice[group]) ? app.choice[group] : ids.includes(dflt) ? dflt : (ids[0] ?? dflt);
};

app.setSpin = (value, i) => {                      // i omitted => all figures
  app.spin = app.spin.map((s, j) => (i === undefined || i === j) ? value : s);
  app.sync();
};
app.toggleSpin = i => app.setSpin(!app.spin[i], i);

app.sync = () => {
  // with nothing able to stop them, keep the figures going
  if (!FEATURES.some(f => f.controls && app.on.has(f.id))) app.spin.fill(true);
  app.anims.forEach((a, i) => app.spin[i] ? a.play() : a.pause());
};

app.render = () => {
  const skin = FEATURES.find(f => f.skin?.id === app.get('look') && app.on.has(f.id)).skin;
  app.stage.replaceChildren(...Array.from({ length: FIGURES }, (_, i) => {
    const fig = el('div', { className: 'fig' }, el('div', { className: 'spinner', innerHTML: svg(skin.draw(i)) }));
    fig.dataset.i = i;
    return fig;
  }));
  app.anims = [...app.stage.querySelectorAll('.spinner')].map((s, i) =>
    s.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: DURATIONS[i] * 1000, iterations: Infinity }));
  FEATURES.filter(f => f.decorate && app.on.has(f.id))
    .forEach(f => app.stage.querySelectorAll('.fig').forEach((fig, i) => f.decorate(fig, i)));
  app.sync();
};

app.applyBg = () => {
  const has = tiles().some(t => t.group === 'bg' && !t.toggle);
  app.stage.className = has ? `bg-${app.get('bg')}` : '';
};

/* ---- gestures on the figures: tap, or hold ------------------------------------ */
{
  const HOLD_MS = 280, presses = new Map();
  app.stage.addEventListener('pointerdown', e => {
    const fig = e.target.closest('.fig');
    if (!fig || e.target.closest('.cam')) return;
    const press = { i: +fig.dataset.i, held: false };
    press.timer = setTimeout(() => { press.held = true; app.emit('holdstart', press.i); }, HOLD_MS);
    presses.set(e.pointerId, press);
  });
  const release = e => {
    const press = presses.get(e.pointerId);
    if (!press) return;
    presses.delete(e.pointerId);
    clearTimeout(press.timer);
    if (press.held) app.emit('holdend', press.i);
    else if (e.type === 'pointerup') app.emit('tap', press.i);
  };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  app.stage.addEventListener('contextmenu', e => e.preventDefault());   // no long-press menu
}

/* =============================================================================
   SOUND  –  always on. Phones need one tap before they allow audio, so a big
   yellow button asks for it (any tap anywhere also works).
   ============================================================================= */

const NOTES = [523.25, 587.33, 659.25, 783.99, 880];            // C D E G A (pentatonic: can't sound bad)
const STEP = 0.23;                                              // seconds per beat step
const LEVELS = [0, 0.25, 0.5, 0.8, 1.2];                        // master gain for 0..4 lit volume squares

const audio = { ctx: null, master: null, volume: 3, muted: false };
const VOICES = {};                                              // name -> (a, t, freq, figure); features add more
const PATTERNS = {};                                            // name -> step -> [{ fig, note }]

const tone = (a, t, type, freq, peak, attack, dur) => {
  const o = a.ctx.createOscillator(), g = a.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.out);
  o.start(t);
  o.stop(t + dur + 0.05);
};

VOICES.beep = (a, t, f) => tone(a, t, 'triangle', f, 0.3, 0.01, 0.18);

{
  const TUNE = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1, 0, 0];
  PATTERNS.tune = n => [{ fig: n % FIGURES, note: TUNE[n % TUNE.length] }];   // each figure plays its own beats
}

const applyVolume = () => audio.master?.gain.setTargetAtTime(audio.muted ? 0 : LEVELS[audio.volume], audio.ctx.currentTime, 0.02);
app.setVolume = v => { audio.volume = v; if (audio.ctx) applyVolume(); app.emit('volume'); };
app.setMuted = m => { audio.muted = m; if (audio.ctx) applyVolume(); app.emit('volume'); };

function ensureAudio() {
  if (!audio.ctx) {
    try { navigator.audioSession.type = 'playback'; } catch { /* iOS 16.4+: ignore the silent switch */ }
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.master = ctx.createGain();
    audio.master.connect(ctx.createDynamicsCompressor()).connect(ctx.destination);
    audio.ctx = ctx;
    ctx.onstatechange = () => app.emit('audio');
    applyVolume();
  }
  if (audio.ctx.state !== 'running') audio.ctx.resume?.();
  app.emit('audio');
}

app.playVoice = (name, t, freq, fig) => {
  try { (VOICES[name] ?? VOICES.beep)({ ctx: audio.ctx, out: audio.master }, t, freq, fig); }
  catch (err) { console.error(`voice ${name} failed`, err); }
};

/* lookahead scheduler: queue the next few beats on the audio clock */
{
  let next = 0, step = 0;
  setInterval(() => {
    const c = audio.ctx;
    if (!c || c.state !== 'running') { next = 0; return; }
    if (next < c.currentTime) next = c.currentTime + 0.05;
    while (next < c.currentTime + 0.15) {
      const pattern = PATTERNS[app.get('beat')] ?? PATTERNS.tune;
      pattern(step++).forEach(({ fig, note }) => { if (app.spin[fig]) app.playVoice(app.get('voice'), next, NOTES[note], fig); });
      next += STEP;
    }
  }, 50);
}

{
  const unlock = () => { if (audio.ctx?.state !== 'running') ensureAudio(); };
  ['click', 'touchend', 'keydown'].forEach(type => document.addEventListener(type, unlock, true));
  document.addEventListener('visibilitychange', () => {
    if (!audio.ctx) return;
    document.hidden ? audio.ctx.suspend() : audio.ctx.resume?.();
  });

  const soundBtn = el('button', { className: 'btn pulse', textContent: '🔊 Tap to turn sound on', onclick: ensureAudio });
  soundBtn.dataset.order = -1;
  app.controls.append(soundBtn);
  app.listeners.audio = [() => { soundBtn.hidden = audio.ctx?.state === 'running'; }];
}

/* =============================================================================
   FEATURE PLUMBING
   ============================================================================= */

function enableFeature(f) {
  app.on.add(f.id);
  f.disposers = [];
  if (f.css) {
    const style = el('style', { textContent: f.css });
    document.head.append(style);
    f.disposers.push(() => style.remove());
  }
  const ctx = {
    app,
    ui: node => { node.dataset.order = FEATURES.indexOf(f); app.controls.append(node); f.disposers.push(() => node.remove()); return node; },
    on: (type, fn) => {
      (app.listeners[type] ??= []).push(fn);
      f.disposers.push(() => { app.listeners[type] = app.listeners[type].filter(x => x !== fn); });
    },
    every: (ms, fn) => { const t = setInterval(fn, ms); f.disposers.push(() => clearInterval(t)); },
    onDispose: fn => f.disposers.push(fn),
  };
  try { f.enable?.(ctx); } catch (err) { console.error(`feature ${f.id} failed`, err); }
}

function disableFeature(f) {
  f.disposers.reverse().forEach(d => { try { d(); } catch (err) { console.error(err); } });
  f.disposers = [];
  app.on.delete(f.id);
}

function applyFeatures(ids) {
  const want = new Set([...ids, ...FEATURES.filter(f => f.locked).map(f => f.id)]);
  FEATURES.filter(f => app.on.has(f.id) && !want.has(f.id)).forEach(disableFeature);
  FEATURES.filter(f => !app.on.has(f.id) && want.has(f.id)).forEach(enableFeature);
  [...app.controls.children].sort((a, b) => a.dataset.order - b.dataset.order).forEach(n => app.controls.append(n));
  renderTiles();
  renderDescriptions();
  app.applyBg();
  app.render();
  syncSwitches();
  syncUrl();
}

/* ---- visual tiles, descriptions ------------------------------------------------ */

function renderTiles() {
  $('#tiles').replaceChildren(...GROUPS.flatMap(g => {
    const ts = tiles().filter(t => t.group === g.id);
    if (!ts.length) return [];
    const picked = app.get(g.id);
    return [el('section', { className: 'group' },
      el('h2', { textContent: g.title }),
      el('div', { className: 'tiles' }, ...ts.map(t => {
        const on = t.toggle ? !!app.flags[t.id] : picked === t.id;
        const b = el('button', { className: 'tile' + (on ? ' on' : ''), onclick: () => choose(t) });
        b.setAttribute('aria-pressed', on);
        b.innerHTML = `<span class="ico">${typeof t.icon === 'function' ? t.icon() : t.icon}</span><span>${t.label}</span>`;
        return b;
      })))];
  }));
}

function choose(t) {
  if (t.toggle) app.flags[t.id] = !app.flags[t.id]; else app.choice[t.group] = t.id;
  renderTiles();
  if (t.group === 'look') app.render();
  if (t.group === 'bg') app.applyBg();
  app.emit('choose', t);
}
app.refreshTiles = renderTiles;

function renderDescriptions() {
  $('#descriptions').replaceChildren(
    el('li', { innerHTML: '<b>Sound</b> always on. Phones want one tap first. iPhone: if it stays silent, check the volume.' }),
    ...FEATURES.filter(f => app.on.has(f.id) && f.desc).map(f => el('li', { innerHTML: `<b>${f.title}</b> ${f.desc}` })));
}

/* ---- "turn things off" panel + URL --------------------------------------------- */

function syncUrl() {
  try {
    const u = new URL(location.href);
    const off = FEATURES.filter(f => !app.on.has(f.id)).map(f => f.id);
    off.length ? u.searchParams.set('off', off.join(',')) : u.searchParams.delete('off');
    u.searchParams.delete('v'); u.searchParams.delete('f');                 // old v0.x links
    history.replaceState(null, '', u);
  } catch { /* sandboxed preview: URL stays as is */ }
}

function buildSwitches() {
  $('#switches').replaceChildren(
    ...FEATURES.filter(f => !f.locked).map(f => {
      const cb = el('input', { type: 'checkbox', onchange: () => applyFeatures(FEATURES.filter(g => g.id === f.id ? cb.checked : app.on.has(g.id)).map(g => g.id)) });
      cb.dataset.id = f.id;
      return el('label', {}, cb, f.title);
    }),
    (() => {
      const cb = el('input', { type: 'checkbox', id: 'mute', onchange: () => app.setMuted(cb.checked) });
      return el('label', {}, cb, '🔇 Mute all sound');
    })());
  $('#reset').onclick = () => {
    Object.assign(app.choice, Object.fromEntries(GROUPS.map(g => [g.id, g.default])));
    app.flags = {};
    app.setVolume(3);
    app.setMuted(false);
    applyFeatures(FEATURES.map(f => f.id));
  };
}
function syncSwitches() {
  document.querySelectorAll('#switches input[data-id]').forEach(cb => { cb.checked = app.on.has(cb.dataset.id); });
  $('#mute').checked = audio.muted;
}

/* =============================================================================
   FEATURES  –  one block each, in the order their controls appear
   ============================================================================= */

// ---- Look: stick figures ------------------------------------------------------
{
  // [left hand, right hand]: each figure holds its arms differently so the spin is visible
  const ARMS = [[[28, 20], [72, 54]], [[26, 54], [74, 20]], [[30, 18], [70, 18]], [[28, 56], [72, 52]]];
  const draw = i => {
    const c = COLORS[i], [[lx, ly], [rx, ry]] = ARMS[i];
    return `<g stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 31V62M50 40L${lx} ${ly}M50 40L${rx} ${ry}M50 62L38 92M50 62L62 92"/>
      <circle cx="50" cy="20" r="11" fill="#fff"/>
      <circle cx="54" cy="17" r="1.8" fill="${c}" stroke="none"/>
      <path d="M61 19l6 3-6 2z" fill="${c}"/>
      <path d="M45 24q5 4 10 0"/>
    </g>`;
  };
  register({
    id: 'stick', locked: true,
    title: 'Stick figures', desc: 'the classic four, drawn with sticks.',
    tiles: [{ group: 'look', id: 'stick', label: 'Stick', icon: () => svg(draw(0)) }],
    skin: { id: 'stick', draw },
  });
}

// ---- Look: round people -------------------------------------------------------
{
  const SKIN = '#ffd6a5', INK = '#2b2d42', PANTS = '#4a4e8a';
  const ARMS = [[[20, 40], [80, 62]], [[18, 64], [82, 38]], [[22, 38], [78, 38]], [[20, 66], [80, 64]]];
  const HAIR = ['#5a3825', '#222', '#c9892b', '#7a2e2e'];
  // one silly accessory each: party hat, ponytail, spiky hair, bow
  const ACCESSORY = [
    c => `<polygon points="41,17 50,1 59,17" fill="${c}"/><circle cx="50" cy="2.5" r="2.5" fill="#fff"/>`,
    c => `<path d="M35 28a15 15 0 0 1 30 0q-15-9-30 0z" fill="${HAIR[1]}"/><circle cx="68" cy="22" r="6" fill="${HAIR[1]}"/><circle cx="64" cy="24" r="2" fill="${c}"/>`,
    () => `<polygon points="36,24 38,10 44,17 50,7 56,17 62,10 64,24" fill="${HAIR[2]}"/>`,
    c => `<polygon points="53,15 44,9 44,21" fill="${c}"/><polygon points="53,15 62,9 62,21" fill="${c}"/><circle cx="53" cy="15" r="2.2" fill="#fff"/>`,
  ];
  const draw = i => {
    const c = COLORS[i], [[lx, ly], [rx, ry]] = ARMS[i];
    return `
      <g stroke="${c}" stroke-width="8" stroke-linecap="round">
        <path d="M38 56L${lx} ${ly}M62 56L${rx} ${ry}"/>
        <path stroke="${PANTS}" d="M43 80L41 93M57 80L59 93"/>
      </g>
      <circle cx="${lx}" cy="${ly}" r="6" fill="${SKIN}"/><circle cx="${rx}" cy="${ry}" r="6" fill="${SKIN}"/>
      <ellipse cx="40" cy="95" rx="7" ry="3.5" fill="${c}"/><ellipse cx="60" cy="95" rx="7" ry="3.5" fill="${c}"/>
      <ellipse cx="50" cy="64" rx="16" ry="18" fill="${c}"/>
      <circle cx="50" cy="29" r="15" fill="${SKIN}" stroke="${INK}" stroke-width="2"/>
      <circle cx="45" cy="27" r="2" fill="${INK}"/><circle cx="55" cy="27" r="2" fill="${INK}"/>
      <circle cx="41" cy="33" r="2.6" fill="#ffadad"/><circle cx="59" cy="33" r="2.6" fill="#ffadad"/>
      <path d="M44 34q6 5 12 0" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
      ${ACCESSORY[i](c)}`;
  };
  register({
    id: 'round',
    title: 'Round people', desc: 'colourful bodies, faces and silly hats.',
    tiles: [{ group: 'look', id: 'round', label: 'Round', icon: () => svg(draw(0)) }],
    skin: { id: 'round', draw },
  });
}

// ---- Look: animals ------------------------------------------------------------
{
  const ANIMALS = ['🐸', '🐵', '🐷', '🐶'];
  register({
    id: 'animal',
    title: 'Animals', desc: 'frog, monkey, pig and dog instead of people.',
    tiles: [{ group: 'look', id: 'animal', label: 'Animals', icon: '🐸' }],
    skin: { id: 'animal', draw: i => `<text x="50" y="54" font-size="76" text-anchor="middle" dominant-baseline="central">${ANIMALS[i]}</text>` },
  });
}

// ---- Look: your own photos (just the picture, no body) --------------------------
{
  const photos = Array(FIGURES).fill(null);        // in memory only: never uploaded, never saved

  // centre-crop to a 256px square (an <img> applies the phone's EXIF rotation for us)
  const toSquare = async file => {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const side = Math.min(img.naturalWidth, img.naturalHeight), size = 256;
      const canvas = el('canvas', { width: size, height: size });
      canvas.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      return canvas.toDataURL('image/jpeg', 0.85);
    } finally { URL.revokeObjectURL(url); }
  };

  register({
    id: 'image',
    title: 'Your photos', desc: 'in "Photos" look, tap 📷 on a figure to pick a picture. It spins on its own. Photos stay on this device and vanish on reload.',
    css: `.cam { position: absolute; right: 2px; bottom: 2px; width: 46px; height: 46px; display: grid; place-items: center;
                 border-radius: 50%; background: #fff; border: 3px solid var(--ink); font-size: 1.3rem; cursor: pointer; }
          .cam input { display: none; }`,
    tiles: [{ group: 'look', id: 'image', label: 'Photos', icon: '📷' }],
    skin: {
      id: 'image',
      draw: i => photos[i]
        ? `<clipPath id="clip${i}"><circle cx="50" cy="50" r="44"/></clipPath>
           <image href="${photos[i]}" x="6" y="6" width="88" height="88" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip${i})"/>
           <circle cx="50" cy="50" r="44" fill="none" stroke="${COLORS[i]}" stroke-width="5"/>`
        : `<circle cx="50" cy="50" r="42" fill="#fff" fill-opacity=".75" stroke="${COLORS[i]}" stroke-width="4" stroke-dasharray="8 7"/>
           <text x="50" y="52" font-size="32" text-anchor="middle" dominant-baseline="central">📷</text>`,
    },
    decorate(fig, i) {
      if (app.get('look') !== 'image') return;
      const input = el('input', { type: 'file', accept: 'image/*' });
      input.onchange = async () => {
        if (!input.files[0]) return;
        try { photos[i] = await toSquare(input.files[0]); } catch (err) { console.error('photo failed', err); return; }
        app.render();
      };
      fig.append(el('label', { className: 'cam', title: 'Pick a photo' }, '📷', input));
    },
  });
}

// ---- Tap a figure to start/stop it ------------------------------------------------
register({
  id: 'tap', controls: true,
  title: 'Tap', desc: 'tap a figure to stop it, tap again to start it.',
  enable({ app, ui, on }) {
    on('tap', i => app.toggleSpin(i));
    ui(el('button', { className: 'btn', textContent: '▶ All spin', onclick: () => app.setSpin(true) }));
    ui(el('button', { className: 'btn', textContent: '⏹ All stop', onclick: () => app.setSpin(false) }));
  },
});

// ===== FEATURES ABOVE THIS LINE =====

/* ---- boot --------------------------------------------------------------------- */
$('#footer').textContent = `TIMER CHECK! v${APP_VERSION}`;
buildSwitches();
const off = new Set((new URLSearchParams(location.search).get('off') ?? '').split(','));
applyFeatures(FEATURES.filter(f => !off.has(f.id)).map(f => f.id));
</script>
</body>
</html>
